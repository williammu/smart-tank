0829, -0.0037, 0.0625, 0.0625, -0.0829, 0.4546, 0.0625, 0.0625, -0.3485, 0.1004, 0.0469, 0.0625, 0.1827, 0.3504, 0.0469, 0.0625, 1.0]}, {"i": 132848, "y": 0, "obs": [-0.5628, -0.496, 0.5223, 0.8528, 1.0, 0.0164, 0.2433, -0.8102, -0.5861, 1.0, 0.2896, 0.3697, 0.3207, 0.2468, 0.3284, -0.8102, -0.5861, 1.0, 0.9939, 1.0, 0.2814, 0.0189, 0.0625, 0.0625, 0.2814, 0.4772, 0.0625, 0.0625, 0.0158, 0.123, 0.0469, 0.0625, 0.547, 0.373, 0.0469, 0.0625, 1.0]}]};

const W = 640, H = 480;
const COLORS = ["#a371f7", "#79c0ff", "#3fb950", "#f0883e", "#f85149"];
// obs 索引（与 rule_teacher.py 对齐）
const ME_X=0, ME_Y=1, FX=2, FY=3, ME_HP=4, FOE_X=5, FOE_Y=6, EFX=7, EFY=8, FOE_HP=9,
      DX=10, DY=11, DIST=12, BDX=13, BDY=14, BVX=15, BVY=16, READY=17, LOS=36, OBS0=20;

let filter = -1, shown = 0;
const PAGE = 24;

// URL 参数 ?f=0..4 预设过滤类别（验证/分享用）
const _f = new URLSearchParams(location.search).get("f");
if (_f !== null && _f !== "") filter = Math.max(-1, Math.min(4, parseInt(_f) || 0));

if (!DATA) {
  document.getElementById("grid").innerHTML =
    '<div class="empty">数据未注入：请先运行 scripts/export_dataset_viz.py</div>';
  document.getElementById("more").style.display = "none";
} else { init(); }

function init() {
  // 统计卡
  const max = Math.max(...Object.values(DATA.counts));
  let sh = `<div class="stat">训练样本<b>${DATA.n_train.toLocaleString()}</b></div>
            <div class="stat">验证样本<b>${DATA.n_val.toLocaleString()}</b></div>`;
  DATA.names.forEach((n, a) => {
    const c = DATA.counts[n];
    sh += `<div class="stat" style="color:${COLORS[a]}">${n}<b style="color:#e6edf3">${c.toLocaleString()}</b>
      <div class="bar"><i style="width:${(c/max*100).toFixed(1)}%;background:${COLORS[a]}"></i></div></div>`;
  });
  document.getElementById("stats").innerHTML = sh;

  // 过滤按钮
  const fb = document.getElementById("filters");
  const mk = (label, v, color) => {
    const b = document.createElement("button");
    b.textContent = label; b.style.color = color || "#e6edf3";
    b.onclick = () => { filter = v; shown = 0; render(true); mark(); };
    fb.appendChild(b); return b;
  };
  const all = [mk("全部", -1, "#e6edf3")];
  DATA.names.forEach((n, a) => all.push(mk(`${n}（${DATA.counts[n].toLocaleString()}）`, a, COLORS[a])));
  function mark() { all.forEach((b, i) => b.classList.toggle("on", i - 1 === filter)); }
  mark();

  document.getElementById("more").onclick = () => render(false);
  render(true);
}

function filtered() {
  return filter < 0 ? DATA.samples : DATA.samples.filter(s => s.y === filter);
}

function render(reset) {
  const grid = document.getElementById("grid");
  if (reset) { grid.innerHTML = ""; shown = 0; }
  const list = filtered();
  const end = Math.min(shown + PAGE, list.length);
  for (let k = shown; k < end; k++) grid.appendChild(card(list[k]));
  shown = end;
  document.getElementById("more").style.display = shown >= list.length ? "none" : "block";
  if (!list.length) grid.innerHTML = '<div class="empty">这个类别没有样本</div>';
}

function card(s) {
  const el = document.createElement("div");
  el.className = "card"; el.dataset.i = s.i;
  const blocked = s.obs[LOS] > 0.5, ready = s.obs[READY] > 0.5;
  el.innerHTML = `
    <div class="head"><span class="idx">#${s.i}</span>
      <span class="badge" style="color:${COLORS[s.y]};border-color:${COLORS[s.y]}">${DATA.names[s.y]}</span></div>
    <div class="cv-wrap"><canvas width="320" height="240"></canvas></div>
    <div class="tags">
      <span>距离 ${(s.obs[DIST] * 800).toFixed(0)}px</span>
      <span class="${blocked ? "warn" : "ok"}">${blocked ? "视线被挡" : "视线畅通"}</span>
      <span class="${ready ? "ok" : ""}">${ready ? "可开火" : "冷却中"}</span>
    </div>`;
  draw(el.querySelector("canvas"), s.obs);
  el.onclick = () => {
    document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
    el.classList.add("sel"); showDetail(s);
  };
  return el;
}

function draw(cv, o) {
  const ctx = cv.getContext("2d"), s = cv.width / W;
  ctx.clearRect(0, 0, cv.width, cv.height);
  // 网格
  ctx.strokeStyle = "#161b22"; ctx.lineWidth = 1;
  for (let x = 0; x <= cv.width; x += 40 * s * 2) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
  for (let y = 0; y <= cv.height; y += 40 * s * 2) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }

  const mx = (o[ME_X] + 1) / 2 * W, my = (o[ME_Y] + 1) / 2 * H;
  const ex = (o[FOE_X] + 1) / 2 * W, ey = (o[FOE_Y] + 1) / 2 * H;

  // 掩体（相对中心 + 半宽半高 → 绝对矩形）
  for (let k = 0; k < 4; k++) {
    const b = OBS0 + k * 4;
    const cx = mx + o[b] * W, cy = my + o[b + 1] * H, hw = o[b + 2] * W, hh = o[b + 3] * H;
    ctx.fillStyle = "#3e444d";
    ctx.fillRect((cx - hw) * s, (cy - hh) * s, hw * 2 * s, hh * 2 * s);
  }

  // 视线（虚线，畅通绿/被挡红）
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = o[LOS] > 0.5 ? "#f85149" : "#2ea043";
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(mx * s, my * s); ctx.lineTo(ex * s, ey * s); ctx.stroke();
  ctx.setLineDash([]);

  // 子弹（有速度 = 存在）
  if (o[BVX] !== 0 || o[BVY] !== 0) {
    const bx = mx + o[BDX] * W, by = my + o[BDY] * H;
    ctx.fillStyle = "#e3b341";
    ctx.beginPath(); ctx.arc(bx * s, by * s, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = "#e3b341";
    ctx.beginPath(); ctx.moveTo(bx * s, by * s);
    ctx.lineTo((bx + o[BVX] * 30) * s, (by + o[BVY] * 30) * s); ctx.stroke();
  }

  tank(ctx, mx, my, o[FX], o[FY], "#5b9dfa", o[ME_HP], s);
  tank(ctx, ex, ey, o[EFX], o[EFY], "#f06256", o[FOE_HP], s);
}

function tank(ctx, x, y, fx, fy, color, hp, s) {
  const R = 12 * s;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x * s, y * s, R, 0, 7); ctx.fill();
  ctx.strokeStyle = "#e6edf3"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x * s, y * s); ctx.lineTo((x + fx * 19) * s, (y + fy * 19) * s); ctx.stroke();
  // 血条
  ctx.fillStyle = "#30363d"; ctx.fillRect(x * s - 15, y * s - R - 8, 30, 3);
  ctx.fillStyle = "#3fb950"; ctx.fillRect(x * s - 15, y * s - R - 8, 30 * Math.max(0, hp), 3);
}

function showDetail(s) {
  const o = s.obs, d = document.getElementById("detail");
  const groups = [
    ["自己", ["x", "y", "朝向cos", "朝向sin", "血量"], 0],
    ["敌人", ["x", "y", "朝向cos", "朝向sin", "血量"], 5],
    ["相对", ["dx", "dy", "距离"], 10],
    ["最近敌弹", ["dx", "dy", "vx", "vy"], 13],
    ["状态", ["冷却就绪", "剩余时间", "常数"], 17],
    ["掩体0", ["dx", "dy", "半宽", "半高"], 20],
    ["掩体1", ["dx", "dy", "半宽", "半高"], 24],
    ["掩体2", ["dx", "dy", "半宽", "半高"], 28],
    ["掩体3", ["dx", "dy", "半宽", "半高"], 32],
    ["视线", ["被挡?"], 36],
  ];
  let rows = "";
  groups.forEach(([g, ks, off]) => {
    rows += `<tr><td class="k">${g}</td>` + ks.map((k, i) =>
      `<td><span style="color:#8b949e">${k}</span> ${o[off + i]}</td>`).join("") + "</tr>";
  });
  d.innerHTML = `<h2>样本 #${s.i} · 标签 = <span style="color:${COLORS[s.y]}">${DATA.names[s.y]}</span>（37 维全量）</h2>
                 <table>${rows}</table>`;
  d.style.display = "block";
}
